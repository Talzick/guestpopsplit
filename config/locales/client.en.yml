        start_test: "Start test"
        delete_test: "Delete draft"
        end_without_winner: "End test without a winner"
        make_default: "Make this the default"
        status_draft: "Draft"
        status_running: "Running"
        draft_description: "Not live yet. Add at least one variant besides the control, then start the test."
        running_description: "Live since %{date}. Visitors are split evenly between the versions below. Pick a winner when you are confident, and it will replace the current version."

        confirm_start: "Start \"%{name}\"? Visitors will be randomly split between the control and the variants from now on."
        confirm_delete_test: "Delete the draft test \"%{name}\" and all its variants?"
        confirm_delete_variant: "Delete \"%{name}\"?"
        confirm_winner: "Make \"%{name}\" the new default and end the test? It will replace the current version for all visitors."
        confirm_winner_control: "Keep the current version (\"%{name}\") and end the test? Nothing will change for visitors."
        confirm_end_no_winner: "End the test without choosing a winner? The current version stays as it is and the results are kept in the history."

        past_tests_heading: "Past tests"
        no_past_tests: "No tests have finished yet."
        history_counts: "%{variants} versions · %{impressions} impressions · %{clicks} clicks"
        history_winner: "Winner: %{name}"
        history_no_winner: "Ended without a winner"

        fields:
          name: "Variant name"
          name_placeholder: "e.g. Variant B"
          name_help: "Only shown here, never to visitors."
          heading: "Heading"
          image: "Image"
          image_url_placeholder: "…or paste an image URL"
          image_help: "Upload an image, or paste the URL of one. Leave empty for no image."
          image_max_width_px: "Max image width (px)"
          subheading: "Subheading"
          body_text: "Body text"
          button_text: "Button text"
          button_url: "Button link"
          button_color: "Button colour"
          button_text_color: "Button text colour"
          button_glow: "Glowing pulse around the button"
          open_in_new_tab: "Open the link in a new tab"
          show_delay_seconds: "Delay before showing (seconds)"
          show_delay_seconds_help: "How long after the page loads the popup appears. 0 shows it straight away. Test different delays by giving each variant its own value."
          banner_image: "Banner image"
          banner_image_help: "Shown on desktop (and on mobile unless a mobile image is set). Upload an image or paste its URL."
          banner_mobile_image: "Mobile image (optional)"
          banner_mobile_image_help: "Shown instead on screens 768px wide or narrower. Leave empty to use the banner image everywhere."
          alt_text: "Alt text"
          alt_text_help: "Describes the image for screen readers and search engines."
          banner_link: "Link"
          reply_name: "Name"
          reply_name_placeholder: "e.g. Chris"
          reply_name_help: "Shown as the author of the reply. Plain text, no link."
          reply_avatar: "Profile photo"
          reply_avatar_help: "Upload an image or paste its URL. Shown as a round avatar next to the name; square images work best. Leave empty for a blank avatar."
          reply_message: "Message"
          reply_message_placeholder: "Write the reply here, with Markdown like a normal post. Every link in it counts as a click."
          reply_message_help: "Markdown, exactly as in the composer: links, images, bold, lists and quotes all work. Clicks on any link in the message are counted."
          reply_insert_image: "Add an image"
          reply_insert_image_help: "Uploads the image and adds it to the end of the message. Move it by editing the Markdown."
