        not_enough_data: "Not enough data yet"
        edit: "Edit"
        delete: "Delete"
        save: "Save"
        preview: "Live preview"
        shows_instantly: "Shows instantly"
        shows_after: "Shows after %{seconds}s"

        edit_baseline: "Edit"
        baseline_stats_since: "Counting since %{date} (when the last test winner was applied)."
        baseline_stats_all_time: "All-time figures."

        new_test_heading: "Start a new test"
        new_test_placeholder: "Test name, e.g. \"Shorter headline\""
        create_test: "Create test"
        default_variant_name: "Variant %{letter}"
