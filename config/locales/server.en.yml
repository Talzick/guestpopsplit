en:
  site_settings:
    guest_cta_enabled: "Master switch for this plugin: the call-to-action popup and the banner shown to logged-out visitors. Logged-in members never see them, and search engine crawlers cannot see them (they are served a separate no-JavaScript view)."
    guest_cta_popup_enabled: "Show the call-to-action popup to logged-out visitors. Set up the popup text under Admin → Plugins → Guest CTA tests before enabling."
    guest_cta_banner_enabled: "Show the clickable banner under the first post of each topic to logged-out visitors. Set up the banner image under Admin → Plugins → Guest CTA tests before enabling."
    guest_cta_show_frequency_hours: "Popup: once dismissed or clicked, don't show it to that visitor again for this many hours. Set to 0 to show on every visit (not recommended)."
    guest_cta_show_close_button: "Popup: show an × close button in the corner."
    guest_cta_close_on_background_click: "Popup: clicking the darkened background closes it."

  guest_cta:
    control_name: "Control (current version)"
    errors:
      test_already_open: "There is already a draft or running test for this placement. Finish or delete it before creating another."
      not_draft: "This is only possible while the test is a draft."
      not_running: "The test is not running."
      need_two_variants: "Add at least one variant besides the control before starting the test."
      another_running: "Another test is already running for this placement."
      test_ended: "This test has ended and can no longer be changed."
      use_baseline_route: "The current version is edited from the dashboard, not as a test variant."
      cannot_delete_control: "The control cannot be deleted."
      banner_not_configured: "Set the current banner's image, alt text and link before starting a banner test."
